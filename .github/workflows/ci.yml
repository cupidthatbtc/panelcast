name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install only the metadata test runner
        run: python -m pip install "pytest==9.1.1"

      - name: Verify tag metadata without project dependencies
        run: |
          python -c 'import importlib.util; assert importlib.util.find_spec("jax") is None'
          python -m pytest --confcutdir=tests/unit tests/unit/test_release_metadata.py -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659  # v0.8.1
        with:
          cache: true

      - name: Run linting
        run: pixi run lint

      - name: Type-check boundary modules
        run: pixi run typecheck

      - name: Whole-package typing ratchet
        run: pixi run typecheck-ratchet

      - name: Domain-terminology ratchet
        run: pixi run terminology-ratchet

  test-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659  # v0.8.1
        with:
          cache: true

      - name: Run fast unit tests with coverage
        run: pixi run pytest tests/ -m "not slow and not e2e" --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  smoke:
    # Tiny synthetic end-to-end (panelcast demo shape) on every PR and main push.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659  # v0.8.1
        with:
          cache: true

      - name: Run end-to-end smoke check
        run: pixi run pytest tests/ -m smoke -q
