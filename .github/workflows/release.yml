name: Publish release

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  # Pinned like the scanners in security.yml: the SBOM is evidence, so the
  # toolchain that writes it does not drift between releases.
  PYYAML_VERSION: "6.0.3"
  PACKAGING_VERSION: "25.0"
  PIP_VERSION: "26.1.2"
  PIP_AUDIT_VERSION: "2.10.1"
  BUILD_VERSION: "1.5.0"
  TWINE_VERSION: "6.2.0"
  PYTEST_VERSION: "9.1.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the pinned release and scanner toolchain
        run: |
          python -m pip install \
            "pip==${PIP_VERSION}" \
            "build==${BUILD_VERSION}" \
            "twine==${TWINE_VERSION}" \
            "pip-audit==${PIP_AUDIT_VERSION}" \
            "pytest==${PYTEST_VERSION}" \
            "pyyaml==${PYYAML_VERSION}" \
            "packaging==${PACKAGING_VERSION}"

      - name: Verify release metadata at the tagged commit
        run: |
          python -m pytest --confcutdir=tests/unit tests/unit/test_release_metadata.py --junitxml="$RUNNER_TEMP/release-metadata.xml" -q
          python -c 'import sys, xml.etree.ElementTree as ET; root=ET.parse(sys.argv[1]).getroot(); suites=[root] if root.tag == "testsuite" else root.findall(".//testsuite"); tests=sum(int(s.get("tests", 0)) for s in suites); skipped=sum(int(s.get("skipped", 0)) for s in suites); sys.exit(f"metadata proof was vacuous: {tests} tests, {skipped} skipped") if tests == 0 or skipped else None' "$RUNNER_TEMP/release-metadata.xml"

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Smoke-test the wheel from an empty directory
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/wheel-env"
          python -m pip --python "$RUNNER_TEMP/wheel-env/bin/python" install dist/*.whl
          tag_version="${GITHUB_REF_NAME#v}"
          wheel_version="$("$RUNNER_TEMP/wheel-env/bin/python" -c 'import importlib.metadata; print(importlib.metadata.version("panelcast"))')"
          if [[ "$tag_version" != "$wheel_version" ]]; then
            echo "Tag version $tag_version does not match wheel version $wheel_version" >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/demo"
          cd "$RUNNER_TEMP/demo"
          JAX_PLATFORMS=cpu "$RUNNER_TEMP/wheel-env/bin/panelcast" demo \
            --num-chains 1 --num-samples 50 --num-warmup 50

      - name: Export the tagged lock's PyPI pins
        id: release_pins
        continue-on-error: true
        run: |
          mkdir -p security
          python scripts/dependency_audit.py --offline \
            --requirements security/pypi-pins.txt

      - name: Audit the tagged lock against OSV
        id: release_osv
        continue-on-error: true
        run: >-
          python scripts/dependency_audit.py
          --json security/osv-findings.json

      - name: Cross-check the tagged lock with pip-audit
        id: release_pip_lock
        continue-on-error: true
        run: >-
          python -m pip_audit -r security/pypi-pins.txt
          --no-deps --strict --progress-spinner off
          --format json --output security/pip-audit-lock.json

      - name: Audit the built wheel runtime closure
        id: release_pip_wheel
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip list --format=freeze \
            | { grep -viE '^panelcast==' || true; } > security/wheel-pins.txt
          python -m pip_audit -r security/wheel-pins.txt \
            --no-deps --strict --progress-spinner off \
            --format json --output security/pip-audit-wheel.json

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

      # Two SBOMs, because they describe different software: the pixi
      # environment the results come from, and the runtime closure a
      # `pip install panelcast` actually gets. Kept out of dist/, since
      # everything there goes to PyPI, which rejects non-distributions.
      - name: Build the environment and wheel-runtime SBOMs
        id: release_sbom
        continue-on-error: true
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p sbom
          python scripts/generate_sbom.py --scope environment \
            --expect-version "$version" \
            --output "sbom/panelcast-$version-environment.cdx.json"
          python scripts/generate_sbom.py --scope wheel \
            --expect-version "$version" \
            --python "$RUNNER_TEMP/wheel-env/bin/python" \
            --output "sbom/panelcast-$version-wheel-runtime.cdx.json"

      - name: Fail closed on release-time advisories and evidence
        if: always()
        run: |
          version="${GITHUB_REF_NAME#v}"
          python scripts/security_gate.py \
            --step "lock pins=${{ steps.release_pins.outcome }}" \
            --step "OSV audit=${{ steps.release_osv.outcome }}" \
            --step "pip-audit (lock)=${{ steps.release_pip_lock.outcome }}" \
            --step "pip-audit (wheel)=${{ steps.release_pip_wheel.outcome }}" \
            --step "SBOM generation=${{ steps.release_sbom.outcome }}" \
            --audit security/osv-findings.json \
            --pip-audit security/pip-audit-lock.json:lock \
            --pip-audit security/pip-audit-wheel.json:wheel-runtime \
            --sbom "sbom/panelcast-$version-environment.cdx.json:pixi-environment" \
            --sbom "sbom/panelcast-$version-wheel-runtime.cdx.json:wheel-runtime" \
            --present security/pypi-pins.txt \
            --present security/wheel-pins.txt

      - name: Upload the SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          if-no-files-found: error
          retention-days: 90

  # Publication is gated on this job: a release whose SBOM did not make it onto
  # the release itself does not ship. A run artifact expires, so it is a
  # convenience copy, never the record.
  release-sbom:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the pinned SBOM verifier dependencies
        run: >-
          python -m pip install
          "pyyaml==${PYYAML_VERSION}"
          "packaging==${PACKAGING_VERSION}"

      - name: Download the SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom

      - name: Attach the SBOMs to the release and read them back
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          # The tag exists (it triggered this run) but the release may not be
          # written yet. Create it as a draft rather than waiting on a human:
          # the SBOMs then ride on the release object from the start, and
          # publishing the notes later keeps them.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            if ! gh release create "$tag" --verify-tag --draft --title "$tag" --generate-notes; then
              # A maintainer may have created the release between view and create.
              for attempt in 1 2 3; do
                gh release view "$tag" >/dev/null 2>&1 && break
                if [ "$attempt" = 3 ]; then
                  echo "::error::could not create or find the GitHub Release for $tag"
                  exit 1
                fi
                sleep 5
              done
            fi
          fi
          gh release upload "$tag" sbom/*.cdx.json --clobber

          # Read the assets back off the release. A freshly uploaded asset can
          # take a moment to become downloadable, so retry a bounded few times --
          # but a mismatch or a still-missing asset fails the job either way.
          for attempt in 1 2 3; do
            rm -rf attached && mkdir attached
            gh release download "$tag" --pattern '*.cdx.json' --dir attached || true
            if cmp -s "sbom/panelcast-$version-environment.cdx.json" \
                      "attached/panelcast-$version-environment.cdx.json" \
               && cmp -s "sbom/panelcast-$version-wheel-runtime.cdx.json" \
                         "attached/panelcast-$version-wheel-runtime.cdx.json"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::the SBOMs on $tag do not match the ones built from it"
              exit 1
            fi
            sleep 15
          done
          python scripts/security_gate.py \
            --sbom "attached/panelcast-$version-environment.cdx.json:pixi-environment" \
            --sbom "attached/panelcast-$version-wheel-runtime.cdx.json:wheel-runtime"

  publish:
    needs: [build, release-sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/panelcast
    permissions:
      contents: read
      # PyPI trusted publishing exchanges this OIDC token in the pinned action below.
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: distributions-${{ github.sha }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # release/v1

  publish-release:
    needs: [publish, release-sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
          if [ "$is_draft" = "true" ]; then
            gh release edit "$tag" --draft=false
          fi
          gh release view "$tag" --json isDraft --jq '.isDraft == false' | grep -qx true
