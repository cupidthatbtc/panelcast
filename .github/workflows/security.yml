name: Dependency security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Advisories land long after a lock is written, so the gate has to re-run on
  # its own rather than only when someone touches a dependency.
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

env:
  # Scanners are pinned like any other dependency: an unpinned scanner silently
  # changes what "clean" means between runs.
  PIP_AUDIT_VERSION: "2.10.1"
  BUILD_VERSION: "1.5.0"
  PYYAML_VERSION: "6.0.3"
  PACKAGING_VERSION: "25.0"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659  # v0.8.1
        with:
          pixi-version: v0.66.0
          cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install the pinned scanners
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m pip install --upgrade \
            "pip-audit==${PIP_AUDIT_VERSION}" \
            "build==${BUILD_VERSION}" \
            "pyyaml==${PYYAML_VERSION}" \
            "packaging==${PACKAGING_VERSION}"
          python -m pip_audit --version | tee evidence/scanner-versions.txt
          pixi --version | tee -a evidence/scanner-versions.txt
          python --version | tee -a evidence/scanner-versions.txt

      # Every scanner below records its own outcome and keeps going: a workflow
      # that stops at the first finding reports one problem, hides the rest, and
      # leaves the artifact short of the evidence it claims to carry. The
      # aggregate gate at the end is what fails the job.
      - name: Export the lock's PyPI pins
        id: pins
        continue-on-error: true
        run: pixi run audit --requirements evidence/pypi-pins.txt

      - name: Audit the lock against OSV
        id: osv
        continue-on-error: true
        run: |
          set -euo pipefail
          pixi run audit --json evidence/osv-findings.json | tee evidence/osv-audit.txt

      # Second, independent PyPI-aware opinion over the wheels the lock pins.
      - name: Cross-check the locked PyPI pins with pip-audit
        id: pip_audit_lock
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m pip_audit -r evidence/pypi-pins.txt --no-deps --strict \
            --progress-spinner off --format json --output evidence/pip-audit-lock.json

      - name: Build the environment SBOM
        id: sbom_environment
        continue-on-error: true
        run: pixi run sbom --scope environment --output evidence/panelcast-environment.cdx.json

      # The lock is not what `pip install panelcast` resolves. Audit that too,
      # or the PyPI-facing half of the project is never scanned at all.
      - name: Resolve and audit the published wheel's runtime closure
        id: wheel_closure
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m build --wheel --outdir dist
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install --upgrade "pip==26.1.2"
          "$RUNNER_TEMP/wheel-env/bin/pip" install dist/*.whl
          python scripts/generate_sbom.py --scope wheel \
            --python "$RUNNER_TEMP/wheel-env/bin/python" \
            --output evidence/panelcast-wheel-runtime.cdx.json
          # Everything the venv holds except panelcast itself, which is the
          # artifact under test and not a release OSV knows about.
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip list --format=freeze \
            | { grep -viE '^panelcast==' || true; } > evidence/wheel-pins.txt
          python -m pip_audit -r evidence/wheel-pins.txt --no-deps --strict \
            --progress-spinner off --format json --output evidence/pip-audit-wheel.json

      - name: Upload the audit findings and SBOMs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dependency-security-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Fail closed on any finding, scanner error, or missing evidence
        if: always()
        run: |
          python scripts/security_gate.py \
            --step "lock pins=${{ steps.pins.outcome }}" \
            --step "OSV audit=${{ steps.osv.outcome }}" \
            --step "pip-audit (lock)=${{ steps.pip_audit_lock.outcome }}" \
            --step "environment SBOM=${{ steps.sbom_environment.outcome }}" \
            --step "wheel closure=${{ steps.wheel_closure.outcome }}" \
            --audit evidence/osv-findings.json \
            --pip-audit evidence/pip-audit-lock.json:lock \
            --pip-audit evidence/pip-audit-wheel.json:wheel-runtime \
            --sbom evidence/panelcast-environment.cdx.json:pixi-environment \
            --sbom evidence/panelcast-wheel-runtime.cdx.json:wheel-runtime \
            --present evidence/pypi-pins.txt \
            --present evidence/wheel-pins.txt \
            --present evidence/scanner-versions.txt
