name: Dependency security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Advisories land long after a lock is written, so the gate has to re-run on
  # its own rather than only when someone touches a dependency.
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659  # v0.8.1
        with:
          cache: true

      - name: Audit the lock against OSV
        run: pixi run audit --json osv-findings.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      # Second, independent PyPI-aware opinion over the wheels the lock pins.
      # It only sees the `pypi:` half; the conda half is what the OSV pass above
      # reaches through pixi's recorded purls.
      - name: Cross-check the PyPI artifacts with pip-audit
        run: |
          python -m pip install --upgrade "pip-audit>=2.7"
          pixi run audit --requirements pypi-pins.txt
          python -m pip_audit -r pypi-pins.txt --no-deps --strict --progress-spinner off

      - name: Build the CycloneDX SBOM
        run: pixi run sbom --output panelcast-sbom.cdx.json

      - name: Upload the audit findings and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dependency-security-${{ github.sha }}
          path: |
            osv-findings.json
            pypi-pins.txt
            panelcast-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30
